[package]
name = "relay-server"
edition.workspace = true
version.workspace = true

[dependencies]
relay-protocol = { path = "../relay-protocol" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
futures-util = "0.3"
